<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zehra'ya Bir Mektup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-landing">
  <div class="atmosphere" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="grain"></div>
  </div>

  <div class="ambient-hearts" id="ambientHearts" aria-hidden="true"></div>

  <section class="landing" id="landing" aria-labelledby="landingTitle">
    <div class="countdown" role="timer" aria-label="Buluşmaya kalan zaman">
      <p class="countdown-label">Buluşmaya kalan zaman</p>
      <div class="countdown-grid" id="countdownGrid">
        <div class="countdown-unit">
          <span class="countdown-value" data-unit="days">0</span>
          <span class="countdown-name">Gün</span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-value" data-unit="hours">00</span>
          <span class="countdown-name">Saat</span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-value" data-unit="minutes">00</span>
          <span class="countdown-name">Dakika</span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-value" data-unit="seconds">00</span>
          <span class="countdown-name">Saniye</span>
        </div>
      </div>
      <p class="countdown-done" id="countdownDone" hidden>Buluşma zamanı geldi 🩵</p>
    </div>

    <div class="landing-card">
      <p class="landing-eyebrow">Zehra'ya</p>
      <h1 class="landing-title" id="landingTitle">Mektuplarım</h1>
      <button class="landing-btn" id="goLettersBtn" type="button">Mektuplara git</button>
    </div>
  </section>

  <nav class="archive-menu" aria-label="Mektup arşivi" hidden>
    <button
      class="archive-toggle"
      id="archiveBtn"
      type="button"
      aria-expanded="false"
      aria-controls="archivePanel"
      aria-haspopup="true"
    >
      Mektuplar
    </button>
    <div class="archive-panel" id="archivePanel" aria-hidden="true" role="menu">
      <p class="archive-heading">Arşiv</p>
      <ul class="archive-list" id="archiveList"></ul>
    </div>
  </nav>

  <main class="stage" hidden>
    <p class="hint" id="hint">Zarfı açmak için dokun</p>

    <button
      class="envelope-btn"
      id="envelopeBtn"
      type="button"
      aria-expanded="false"
      aria-controls="letter"
      aria-label="Zarfı aç"
    >
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="letter" id="letter" aria-hidden="true">
          <article class="letter-sheet" id="letterContent"></article>
        </div>
        <div class="envelope-front">
          <div class="envelope-pocket"></div>
        </div>
        <div class="envelope-flap"></div>
        <div class="wax-seal" aria-hidden="true">
          <span></span>
        </div>
      </div>
    </button>
  </main>

  <div class="petal-field" id="petalField" aria-hidden="true"></div>

  <div class="music-embed" aria-hidden="true">
    <div id="youtube-player"></div>
  </div>

  <script src="script.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
